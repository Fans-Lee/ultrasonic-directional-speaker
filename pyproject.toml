[project]
name = "ultrasonic-directional-speaker"
version = "0.1.0"
description = "Tools for the ultrasonic directional speaker project"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "lap>=0.5.12",
    "matplotlib==3.9.4",
    "numpy==1.26.4",
    "pyside6>=6.7,<7",
    "pyserial>=3.5",
    "sounddevice>=0.5,<1",
    "tomli>=2.0; python_version < '3.11'",
    "ultralytics==8.4.138",
]

[project.optional-dependencies]
spatial = [
    "openvino>=2026.2,<2027",
]
cuda = [
    "torch==2.8.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision==0.23.0; sys_platform == 'win32' or sys_platform == 'linux'",
]
xpu = [
    "pytorch-triton-xpu==3.4.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch==2.8.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision==0.23.0; sys_platform == 'win32' or sys_platform == 'linux'",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cuda" },
        { extra = "xpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]
pytorch-triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
